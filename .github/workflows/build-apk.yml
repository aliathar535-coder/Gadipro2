name: Build PWA APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate TWA Config Non-Interactively
        run: |
          npx @bubblewrap/cli init --manifest https://aliathar535-coder.github.io/Gadipro2/manifest.json --directory ./android-app --skip_jdk_check --appname "Gadipro" --packageId "com.gadipro.app" --srcurl "https://aliathar535-coder.github.io/Gadipro2/"

      - name: Build APK File
        run: |
          cd android-app
          bubblewrap build
          
