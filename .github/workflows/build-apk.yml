name: Build PWA APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build TWA Project Non-Interactively
        run: |
          bubblewrap init --manifest https://aliathar535-coder.github.io/Gadipro2/manifest.json --directory ./android-app --skip_jdk_check --path 
          
