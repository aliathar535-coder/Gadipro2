name: Build PWA APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Create TWA Config Manually
        run: |
          echo '{
            "packageId": "com.gadipro.app",
            "host": "aliathar535-coder.github.io",
            "name": "Gadipro",
            "shortName": "Gadipro",
            "startUrl": "/Gadipro2/",
            "manifestUrl": "https://aliathar535-coder.github.io/Gadipro2/manifest.json",
            "themeColor": "#ffffff",
            "navigationColor": "#ffffff",
            "backgroundColor": "#ffffff",
            "display": "standalone",
            "orientation": "any",
            "shortcuts": [],
            "iconUrl": "https://aliathar535-coder.github.io/Gadipro2/favicon.ico",
            "maskableIconUrl": "",
            "monochromeIconUrl": "",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": false,
            "enableNotifications": false,
            "appVersionName": "1.0",
            "appVersionCode": 1,
            "allowPermissionsOnStart": false
          }' > twa-manifest.json

      - name: Build APK File
        run: |
          bubblewrap build --skip-signing
          
